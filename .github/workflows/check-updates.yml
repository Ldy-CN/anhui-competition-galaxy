name: Check competition website updates

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 UTC 01:00（北京时间周一 09:00）——每周检测一次官网更新
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run update monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-updates.mjs
      - name: Commit refreshed monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/monitor-state.json
          git diff --cached --quiet || git commit -m "chore(monitor): 刷新监控状态 [skip ci]"
          git push
